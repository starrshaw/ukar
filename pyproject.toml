[project]
name = "ukar"
version = "0.1.0"
description = "Uncertainty-aware knowledge acquisition. A local model names missing facts; sources return those facts; the same local model answers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "starrshaw" }]
keywords = ["llama.cpp", "ollama", "local-llm", "tools"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
ukar = "ukar.__main__:main"

[project.urls]
Homepage = "https://github.com/starrshaw/ukar"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ukar*"]
